<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="ohm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Ternary matrix pattern -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#6c5ce7"/>
      <circle cx="12" cy="12" r="2" fill="#1e1e22"/>
      <circle cx="20" cy="20" r="2" fill="#a29bfe"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Central Ω symbol -->
  <text x="600" y="320" text-anchor="middle" font-family="serif" font-size="200" font-weight="700" fill="url(#ohm)" filter="url(#glow)" opacity="0.9">Ω</text>

  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="42" fill="#a29bfe" letter-spacing="8">HarmonyOhm</text>
  <text x="600" y="478" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="16" fill="#6c5ce7" letter-spacing="6">THE OS THAT HUMS</text>

  <!-- Architecture line -->
  <text x="600" y="530" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#636e72">
    KERNEL8 — MATRIX — HARMONYOHM — VAKED — {n+-1-&lt;△&gt;}
  </text>

  <!-- Dedication -->
  <text x="600" y="570" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#636e72">
    for István · József · Wraith · and the third one
  </text>

  <!-- Bottom mantra -->
  <text x="600" y="605" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#636e72">
    Om mani padme hum · {-1, 0, +1} · Ω · genesis: 7c242080
  </text>
</svg>
