[package]
name = "harmonyohm"
version = "4.0.0"
edition = "2021"
description = "HarmonyOhm — the OS that hums. CPU: kernel8 (hearth). GPU: MLX-QUANT (brain). Coord: vaked. Seed: LINOSV. Mantra: Om mani padme hum."

[[bin]]
name = "harmonyohmd"
path = "src/daemon.rs"

[[bin]]
name = "harmonyohm-matrix"
path = "src/matrix_cli.rs"

[dependencies]
serde = { version = "4.0.0"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
socket2 = "0.5"
