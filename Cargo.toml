[package]
name = "harmonyohm"
version = "0.2.0"
edition = "2021"
description = "ayeOS — ternary matrix inference daemon. CPU: kernel8 (hearth). GPU: MLX-QUANT (brain). Coord: vaked (capability graph)."

[[bin]]
name = "harmonyohmd"
path = "src/daemon.rs"

[[bin]]
name = "harmonyohm-matrix"
path = "src/matrix_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
socket2 = "0.5"
